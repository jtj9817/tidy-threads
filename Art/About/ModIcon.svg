<?xml version="1.0" encoding="UTF-8"?>
<!-- Mod icon, 64x64, shown in the mod list: a coat hanger with a folded shirt on a stitched wooden tile. Bold shapes
     only; it is often drawn at 32 px or less. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c38a54"/>
      <stop offset="1" stop-color="#7a4d2a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="11" fill="url(#tile)" stroke="#2a1a0e" stroke-width="3"/>
  <rect x="7" y="7" width="50" height="50" rx="7" fill="none" stroke="#f3e2c4" stroke-width="1.6"
        stroke-dasharray="4 3" opacity="0.75"/>
  <!-- Hanger. -->
  <path d="M32,21 C32,17 36,17 36,13.5 C36,11 34,9.5 32,9.5 C29.5,9.5 28,11 28,13" fill="none" stroke="#2a1a0e"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M32,21 L12,33 L52,33 Z" fill="none" stroke="#2a1a0e" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Shirt hanging from it. -->
  <path d="M14,33 L24,28 Q32,34 40,28 L50,33 L46,39 L42,37 L42,54 L22,54 L22,37 L18,39 Z" fill="#c9483e"
        stroke="#2a1a0e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24,28 L32,37 L40,28" fill="none" stroke="#2a1a0e" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
